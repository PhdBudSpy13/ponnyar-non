:root{--primary:#0b7a43;--accent:#c9a227;--bg:#f2f7f1;--surface:#fff;--text:#14231a;--on-primary:#fff;--radius:18px;--fs:1;--wm:.07;--wmp:.08;
--muted:color-mix(in srgb,var(--text) 58%,var(--surface));--line:color-mix(in srgb,var(--text) 12%,var(--surface));
--soft:color-mix(in srgb,var(--primary) 9%,var(--surface));--soft2:color-mix(in srgb,var(--primary) 16%,var(--surface));
--bad:#c0392b;--ok:#1a8f4d;--warn:#c57d00;
--shadow:0 1px 2px rgba(20,35,26,.05),0 10px 30px -12px rgba(20,35,26,.18);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{font-size:calc(17px*var(--fs));-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);line-height:1.65;
font-family:"Sarabun","Noto Sans Myanmar","Noto Sans Thai","Thonburi","Myanmar Text","Myanmar Sangam MN",system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);background-image:radial-gradient(900px 500px at 8% -5%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 60%),radial-gradient(800px 500px at 100% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%);background-attachment:fixed}
.mon{font-family:"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN","Padauk",sans-serif;line-height:1.9}
h1,h2,h3,h4{margin:0;line-height:1.3}
p{margin:.35em 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px;border-radius:8px}
/* watermark */
#wm{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
#wm img{width:min(72vmin,640px);opacity:var(--wm);user-select:none;-webkit-user-drag:none}
#app,#admin{position:relative;z-index:1}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 140px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:calc(var(--radius) * .8);padding:11px 22px;font-weight:700;background:var(--primary);color:var(--on-primary);
box-shadow:0 8px 20px -8px color-mix(in srgb,var(--primary) 70%,transparent);transition:transform .18s var(--ease),filter .18s,box-shadow .18s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--surface);color:var(--primary);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--primary) 70%,transparent)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.gold{background:var(--accent);color:#2a2000;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:none}
.btn.sm{padding:6px 13px;font-size:.86rem;border-radius:11px;box-shadow:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.ico{width:1.1em;height:1.1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* splash */
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;overflow:auto;
background:radial-gradient(900px 600px at 50% 15%,color-mix(in srgb,var(--primary) 20%,var(--bg)),var(--bg) 70%)}
.splash.out{animation:fadeOut .55s var(--ease) forwards}
.splash::before,.splash::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 9s ease-in-out infinite;pointer-events:none}
.splash::before{width:46vmax;height:46vmax;left:-16vmax;top:-12vmax;background:color-mix(in srgb,var(--primary) 30%,transparent)}
.splash::after{width:40vmax;height:40vmax;right:-14vmax;bottom:-14vmax;background:color-mix(in srgb,var(--accent) 35%,transparent);animation-delay:-4s}
.splash>*{position:relative;z-index:1}
.logos{display:flex;gap:18px;align-items:center;justify-content:center}
.splash .logos{animation:rise .9s .05s both var(--ease)}
.splash .logos img{height:92px;width:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.14))}
.splash .logos img+img{height:110px}
.splash .hello{font-size:clamp(2.6rem,12vw,5rem);font-weight:700;margin:.1em 0;padding:.1em .2em;color:transparent;
background:linear-gradient(100deg,var(--primary),var(--accent) 45%,var(--primary) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:rise 1s .2s both var(--ease),shine 6s 1.2s linear infinite}
.splash h1{font-size:clamp(1.25rem,4.5vw,1.8rem);animation:rise 1s .35s both var(--ease)}
.splash p.sub{color:var(--muted);max-width:30em;margin:0;animation:rise 1s .45s both var(--ease)}
.langs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px;animation:rise 1s .6s both var(--ease)}
.langs .btn{min-width:150px;font-size:1.05rem;padding:14px 24px}
.loadbar{width:140px;height:4px;border-radius:9px;background:var(--line);overflow:hidden;opacity:0;transition:opacity .3s}
.loadbar.on{opacity:1}.loadbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:9px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
@keyframes shine{to{background-position:-220% 0}}
@keyframes float{50%{transform:translate(4vmax,3vmax) scale(1.08)}}
@keyframes fadeOut{to{opacity:0;visibility:hidden;transform:scale(1.02)}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
/* header */
.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);background:color-mix(in srgb,var(--surface) 78%,transparent);border-bottom:1px solid var(--line)}
.top .in{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.top .logos img{height:38px;width:auto;display:block}
.top .logos{gap:8px}
.top .ttl{flex:1;min-width:0;font-weight:700;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font-weight:700;font-size:.85rem;color:var(--primary);transition:all .25s var(--ease)}
.seg button.on{background:var(--primary);color:var(--on-primary);box-shadow:0 3px 10px -3px color-mix(in srgb,var(--primary) 60%,transparent)}
.pbar{height:4px;background:var(--line)}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .6s var(--ease)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;background:var(--soft);color:var(--primary);font-weight:700;font-size:.8rem;white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.chip.gold{background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:#6b5200}
/* cards */
.card{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin:18px 0}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
.hero{padding:30px 2px 4px}
.hero h1{font-size:clamp(1.55rem,5.4vw,2.2rem);color:var(--primary);letter-spacing:.005em}
.hero p{color:var(--muted);margin:6px 0 0}
.card h2{font-size:1.08rem;color:var(--primary);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card h2 .ic{width:30px;height:30px;border-radius:10px;background:var(--soft2);display:inline-grid;place-items:center;font-size:.95rem}
.idrow{display:grid;grid-template-columns:1.3fr 1fr auto;gap:14px;align-items:end}
@media(max-width:620px){.idrow{grid-template-columns:1fr}}
label.fld{display:block;font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.inp{width:100%;margin-top:4px;padding:11px 14px;border-radius:calc(var(--radius) * .7);border:1.5px solid var(--line);background:var(--surface);transition:border-color .2s,box-shadow .2s;font-size:1rem}
.inp:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent)}
.inp.err{border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
ol.ins{margin:0;padding:0;list-style:none;counter-reset:n}
ol.ins li{counter-increment:n;display:flex;gap:12px;margin:9px 0;align-items:flex-start}
ol.ins li::before{content:counter(n);flex:none;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:.8rem;display:grid;place-items:center;margin-top:2px}
.boxes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:560px){.boxes{grid-template-columns:1fr}}
.bx{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px}
.bx b{flex:none;width:34px;height:34px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:1.05rem}
.bx small{display:block;color:var(--muted);line-height:1.35}
.sec-h{margin:34px 4px 0;display:flex;flex-direction:column;gap:2px}
.sec-h h2{font-size:1.35rem;color:var(--primary)}.sec-h p{color:var(--muted);margin:0}
.pass{border-left:6px solid var(--accent)}
.pass h3{font-size:1.05rem;color:var(--primary);margin-bottom:6px}
.pass .txt{font-size:1rem}
.pass .src{margin-top:10px;font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.q{padding:18px 20px}
.q .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.q .no{width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.q .qt{font-weight:600;margin:4px 0 10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:calc(var(--radius) * .75);background:var(--surface);cursor:pointer;position:relative;transition:transform .18s var(--ease),border-color .2s,background .2s,box-shadow .2s}
.opt:hover{border-color:color-mix(in srgb,var(--primary) 50%,var(--line));transform:translateX(3px)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.82rem;transition:all .25s var(--ease);background:var(--surface)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt.on{border-color:var(--primary);background:var(--soft);box-shadow:0 8px 22px -14px var(--primary)}
.opt.on .l{background:var(--primary);color:var(--on-primary);border-color:var(--primary);animation:pop .35s var(--ease)}
.opt:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}
.q.missing{animation:shake .45s;border-color:var(--bad)}
textarea.inp{min-height:130px;resize:vertical;line-height:1.6}
.cnt{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:4px}
details.ref{margin:2px 0 10px;border-radius:12px;background:var(--soft);padding:8px 14px}
details.ref summary{cursor:pointer;font-weight:700;color:var(--primary);font-size:.9rem}
details.ref .txt{margin-top:8px;font-size:.95rem}
.foot{text-align:center;color:var(--muted);font-size:.82rem;margin:30px 0 0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--surface) 82%,transparent);border-top:1px solid var(--line)}
.dock .in{max-width:860px;margin:0 auto;display:flex;gap:14px;align-items:center}
.dock .prog{flex:1;min-width:0;font-size:.85rem;color:var(--muted)}.dock .prog b{color:var(--text)}
.mini{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}.mini i{display:block;height:100%;width:0;background:var(--primary);transition:width .5s var(--ease);border-radius:9px}
/* modal / toast */
.ov{position:fixed;inset:0;z-index:200;background:rgba(10,20,14,.5);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;animation:fadeIn .2s both}
@keyframes fadeIn{from{opacity:0}}
.md{background:var(--surface);border-radius:calc(var(--radius) * 1.1);padding:24px;max-width:460px;width:100%;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:rise .35s var(--ease) both;max-height:92vh;overflow:auto}
.md h3{font-size:1.15rem;color:var(--primary);margin-bottom:8px}
.md .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:300;background:#14231a;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:rise .3s var(--ease) both}
.toast.bad{background:var(--bad)}
/* done */
.done{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px 0}
.done .check{width:96px;height:96px}
.done .check circle{stroke:var(--primary);stroke-width:4;fill:color-mix(in srgb,var(--primary) 10%,transparent);stroke-dasharray:290;stroke-dashoffset:290;animation:draw .8s .1s ease forwards}
.done .check path{stroke:var(--primary);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done .thx{font-size:clamp(2.4rem,11vw,4.2rem);font-weight:700;color:transparent;background:linear-gradient(100deg,var(--primary),var(--accent),var(--primary));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;animation:rise .9s .9s both var(--ease),shine 6s 1.8s linear infinite;padding:.1em .2em}
.done p{animation:rise .9s 1.05s both var(--ease);color:var(--muted);max-width:28em}
.done .rc{animation:rise .9s 1.2s both var(--ease);background:var(--soft);border-radius:16px;padding:10px 22px;font-size:.9rem}
.petal{position:fixed;top:-30px;width:12px;height:18px;border-radius:70% 0 70% 0;opacity:.85;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(540deg);opacity:0}}
.demo{position:fixed;left:10px;top:60px;z-index:35}
/* ===== admin ===== */
#admin{position:fixed;inset:0;z-index:150;overflow:auto;background:var(--bg);background-image:radial-gradient(900px 500px at 8% -5%,color-mix(in srgb,var(--primary) 12%,transparent),transparent 60%)}
.adm-top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.adm-top .in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.adm-top img{height:36px}
.adm-top h1{font-size:1.1rem;color:var(--primary)}
.tabs{display:flex;gap:4px;overflow:auto;max-width:1180px;margin:0 auto;padding:0 14px 8px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;color:var(--muted);white-space:nowrap;transition:all .2s var(--ease)}
.tabs button.on{background:var(--primary);color:var(--on-primary)}
.tabs button:not(.on):hover{background:var(--soft)}
.adm{max-width:1180px;margin:0 auto;padding:16px 18px 120px}
.adm .card{margin:14px 0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);animation:rise .5s var(--ease) both}
.stat small{color:var(--muted);font-weight:700;font-size:.75rem;letter-spacing:.03em}
.stat b{display:block;font-size:1.7rem;color:var(--primary);line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{position:sticky;top:0;text-align:left;background:var(--soft);color:var(--primary);padding:9px 10px;font-size:.78rem;white-space:nowrap;cursor:pointer;user-select:none}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--primary) 4%,transparent)}
.tblw{overflow:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface);max-height:62vh}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--primary);transition:width .8s var(--ease)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.toolbar .inp,.toolbar select{width:auto;margin:0;padding:8px 12px}
.sw{display:flex;gap:10px;align-items:center}
input[type=color]{width:48px;height:38px;padding:2px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--primary)}
.ed{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:var(--surface);animation:rise .4s var(--ease) both}
.ed>.hd{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.ed>.hd b{color:var(--primary)}
.lang2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.lang2{grid-template-columns:1fr}}
.lt{display:inline-block;font-size:.68rem;font-weight:700;background:var(--soft2);color:var(--primary);border-radius:6px;padding:0 6px;margin-right:4px}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.75rem;font-weight:700}
.t-ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}.t-wait{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}.t-no{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--bad)}
.dirty{position:sticky;top:96px;z-index:4;background:#fff7dc;border:1px solid #ecd27a;color:#6b5200;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;animation:rise .3s var(--ease) both}
.keyopt{display:flex;gap:8px;align-items:center;margin:4px 0}
.keyopt input[type=radio]{accent-color:var(--primary);width:18px;height:18px}
.rub{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.score-btns{display:flex;gap:4px}
.score-btns button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.score-btns button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.ans{padding:10px 12px;border-radius:12px;margin:6px 0;background:var(--soft)}
.ans.ok{background:color-mix(in srgb,var(--ok) 11%,var(--surface))}.ans.no{background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.essay-txt{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px 14px}
.lock{max-width:340px}
.lock input{text-align:center;letter-spacing:.5em;font-size:1.5rem}
/* print */
#printRoot{display:none}
@media print{
 @page{size:A4;margin:14mm 12mm}
 body{background:#fff!important;background-image:none!important}
 body>*:not(#printRoot){display:none!important}
 #printRoot{display:block;position:relative;color:#000}
 #printRoot .pwm{position:fixed;inset:0;display:grid;place-items:center;z-index:0;pointer-events:none}
 #printRoot .pwm img{width:62%;opacity:var(--wmp)}
 #printRoot .pc{position:relative;z-index:1}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pc{font-size:11pt;line-height:1.5}
.pc h1{font-size:17pt;color:var(--primary);margin:0}.pc h2{font-size:13pt;color:var(--primary);margin:14pt 0 4pt;border-bottom:1.5px solid var(--primary);padding-bottom:2pt}
.pc .ph{display:flex;gap:12pt;align-items:center;border-bottom:3px solid var(--primary);padding-bottom:8pt;margin-bottom:8pt}.pc .ph img{height:46pt}
.pc table{width:100%;border-collapse:collapse;font-size:9.5pt}.pc th,.pc td{border:1px solid #9aa;padding:3pt 5pt;text-align:left}.pc th{background:var(--soft2)}
.pc .box{border:1px solid #9aa;border-radius:6pt;padding:6pt 9pt;margin:5pt 0;break-inside:avoid}
.pc .opt2{margin:1pt 0 1pt 14pt}.pc .line{border-bottom:1px solid #666;height:18pt}
.pc .ok{color:#126b37;font-weight:700}.pc .no{color:#b02a1c;font-weight:700}
.pc .pb{break-before:page}
@media(max-width:560px){.top .ttl{display:none}.top .in{gap:8px}.top .logos img{height:34px}.splash .logos img{height:76px}.splash .logos img+img{height:92px}.dock .btn{padding:10px 16px}.card{padding:16px}.demo{top:52px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
/* ===== hub (เมนูหน้าแรก / หน้าย่อย) ===== */
.splash{justify-content:flex-start}
.splash .home{margin:auto;width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 30px}
.splash .home .logos{animation:rise .9s .05s both var(--ease)}
.splash h1{max-width:20em}
.splash .langs{margin-top:2px}
.splash .choose{margin:8px 0 0;font-weight:700;color:var(--primary);animation:rise 1s .5s both var(--ease)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}

การยากที่จะแน่ใจเรื่องที่เกิดขึ้นนานมาแล้ว นักประวัติศาสตร์จึงบอกไม่ได้ว่ากลุ่มใดมาถึงพม่าก่อน บุคคลสำคัญทางประวัติศาสตร์ก็มีมุมมองต่างกัน สำหรับชาวพม่าจำนวนมาก พระเจ้าตะเบ็งชเวตี้เป็นวีรบุรุษ แต่สำหรับชาวมอญ พระองค์เป็นผู้กดขี่","en":"The history of Burma has always been a controversial subject. Even in ancient times, the people in Burma presented different ideas about history in their legends, songs, and poems. People still disagree today. … The first evidence of a kingdom in Burma comes from the Pyu people, who had a city in the 1st century AD. Some Burmans say the Pyu are their ancestors and others say the Burmans founded the old city of Tagaung even before the Pyu came. … The Mon have lived in Southeast Asia for over two thousand years. It is difficult to be sure about events that happened so long ago, so historians cannot figure out which group arrived in Burma first. There are also different perspectives on historical personalities. To many Burmans, King Tabinshweti is a hero; but for Mons, he is an oppressor."},"src":{"th":"ที่มา: Thabyay Education Foundation / Curriculum Project (2016). History of Burma, Student Book (HoB-SB), หน้า 3 คัดข้อความสั้นเพื่อการวิจัย คำแปลภาษาไทยเป็นของผู้วิจัย","en":"Source: Thabyay Education Foundation / Curriculum Project (2016). History of Burma, Student Book (HoB-SB), p. 3. Short excerpts quoted for research use."}},{"id":"p2","title":{"th":"อาณาจักรโบราณ (เส้นเวลาของชาวมอญ)","en":"Ancient Kingdoms (Mon timeline)"},"text":{"th":"ศตวรรษที่ ๒ • ชาวมอญสร้างเมืองที่สะเทิม เชื่อมกับศูนย์กลางการค้าอื่นในเอเชียตะวันออกเฉียงใต้\nศตวรรษที่ ๙ • ชาวมอญสร้างอาณาจักรที่พะโคและสะเทิม เรียกว่ารามัญเทศะ\nศตวรรษที่ ๑๑ • การติดต่อระหว่างชาวพม่ากับชาวมอญ: ราว ค.ศ. ๑๐๕๗ พระเจ้าอโนรธาแห่งพุกามนำพระเจ้ามนูหะแห่งสะเทิมไปยังพุกาม พระภิกษุเถรวาท ช่างศิลป์ และช่างก่อสร้างจากพะโคสร้างวัดเกือบ ๒,๐๐๐ แห่งในพุกาม ชาวพม่าพัฒนาภาษาเขียนโดยอิงภาษามอญ\nศตวรรษที่ ๑๒ • อารยธรรมพม่าและมอญที่พุกามเข้มแข็งมาก\nศตวรรษที่ ๑๓ • กษัตริย์มอญ–ฉานนามวาเรรุ … ตั้งอาณาจักรหงสาวดีที่พะโคและเมาะตะมะ","en":"2nd century • Mon people establish a city at Thaton connected to other trading centers in Southeast Asia.\n9th century • Mon people establish a kingdom at Pegu and Thaton called Ramanyadesa.\n11th century • Contact between Burmans and Mons: Around 1057, King Anawrhata of Pagan takes King Manuha of Thaton to Pagan. Theravada Buddhist monks, artists, and builders from Pegu build nearly 2,000 temples in Pagan. Burmans develop a written language based on Mon language.\n12th century • Burman and Mon civilization at Pagan is very strong.\n13th century • A Mon-Shan king named Wareru … establishes a kingdom called Hongsawaddy at Pegu and Martaban."},"src":{"th":"ที่มา: Thabyay Education Foundation / Curriculum Project (2016). History of Burma, Student Book (HoB-SB), หน้า 9–10 คัดข้อความสั้นเพื่อการวิจัย คำแปลภาษาไทยเป็นของผู้วิจัย","en":"Source: Thabyay Education Foundation / Curriculum Project (2016). History of Burma, Student Book (HoB-SB), pp. 9–10. Short excerpts quoted for research use."}},{"id":"p3","title":{"th":"สงครามอังกฤษ–พม่าและการปกครองแบบอาณานิคม","en":"The Anglo-Burmese Wars and Colonial Rule"},"text":{"th":"ทำไมอังกฤษจึงชนะสงครามกับกษัตริย์ราชวงศ์โกนบอง? เหตุผลส่วนหนึ่งคืออังกฤษมีอาวุธดีกว่าและทหารมากกว่า อีกเหตุผลคือกษัตริย์โกนบองมีปัญหาอื่นด้วย มีการทะเลาะกันในราชวงศ์ และกษัตริย์คุมอาณาจักรไม่อยู่เพราะกลุ่มชาติพันธุ์ต่าง ๆ ก่อกบฏ … อังกฤษคิดว่าจะปกครองพม่าได้ง่ายกว่าถ้าแยกกลุ่มชาติพันธุ์ออกจากกัน และรู้สึกว่าตนกำลังปกป้องกลุ่มชาติพันธุ์ที่เล็กและมีอำนาจน้อยจากกลุ่มที่ใหญ่และมีอำนาจมากกว่า … อังกฤษไม่ได้ก่อปัญหาทั้งหมดระหว่างกลุ่มชาติพันธุ์ในพม่า แต่ทำให้การแบ่งแยกเพิ่มขึ้น","en":"Why were the British able to win the wars against the Konbaung kings? Part of the reason is that the British had better weapons and more soldiers. Another reason is that the Konbaung kings had other problems. There were fights within the royal family. And the kings were having problems keeping the empire under control, because different ethnic groups were rebelling. … The British thought they could rule Burma more easily if they separated the ethnic groups from one another, and they also felt that they were protecting the smaller, less powerful ethnic groups from the larger, more powerful ones. … The British did not cause all of the problems between ethnic groups in Burma, but they did increase the divisions between them."},"src":{"th":"ที่มา: Thabyay Education Foundation / Curriculum Project (2016). History of Burma, Student Book (HoB-SB), หน้า 15, 17 คัดข้อความสั้นเพื่อการวิจัย คำแปลภาษาไทยเป็นของผู้วิจัย","en":"Source: Thabyay Education Foundation / Curriculum Project (2016). History of Burma, Student Book (HoB-SB), pp. 15, 17. Short excerpts quoted for research use."}}],"mcq":[{"id":"q1","passage":"p1","level":"analyze","box":"C","pts":2,"q":{"th":"ข้อใดเป็นข้อเท็จจริงที่ตรวจสอบได้ตามบทอ่านที่ ๑ ไม่ใช่ความเห็นหรือการตีความ","en":"Which statement is a checkable fact according to Passage 1, not an opinion or an interpretation?"},"opts":[{"th":"ชาวพม่าเป็นกลุ่มแรกที่มาถึงพม่า ก่อนชาวปยูนานมาก","en":"The Burmans were the first group to arrive in Burma, long before the Pyu."},{"th":"หลักฐานแรกของอาณาจักรในพม่ามาจากชาวปยู","en":"The first evidence of a kingdom in Burma comes from the Pyu."},{"th":"พระเจ้าตะเบ็งชเวตี้เป็นวีรบุรุษผู้ยิ่งใหญ่ของทุกคนที่อาศัยในพม่า","en":"King Tabinshweti was a great hero for everyone who lives in Burma."},{"th":"ปัจจุบันนักประวัติศาสตร์เห็นตรงกันว่ากลุ่มใดมาถึงพม่าก่อน","en":"Historians now agree about which group arrived in Burma first."}]},{"id":"q2","passage":"p1","level":"analyze","box":"F","pts":2,"q":{"th":"ประโยค “เป็นการยากที่จะแน่ใจเรื่องที่เกิดขึ้นนานมาแล้ว” ทำ “หน้าที่” อะไรในบทอ่านที่ ๑","en":"What FUNCTION does the sentence “It is difficult to be sure about events that happened so long ago” have in Passage 1?"},"opts":[{"th":"พิสูจน์ว่าชาวมอญมาถึงเอเชียตะวันออกเฉียงใต้ก่อนกลุ่มอื่นใด","en":"It proves that the Mon arrived in Southeast Asia before any other group."},{"th":"เตือนผู้อ่านว่าบันทึกเก่าในสมัยโบราณทุกฉบับเป็นเท็จ","en":"It warns readers that all old records of ancient times are false."},{"th":"แสดงว่าเมืองของชาวปยูเก่ากว่าเมืองตะกองเก่า","en":"It shows that the Pyu city was older than the old city of Tagaung."},{"th":"อธิบายว่าทำไมนักประวัติศาสตร์ระบุกลุ่มแรกไม่ได้","en":"It explains why historians cannot name the first group."}]},{"id":"q3","passage":"p1","level":"evaluate","box":"M","pts":2,"q":{"th":"นักเรียนคนหนึ่งเขียนว่า “นักประวัติศาสตร์พิสูจน์แล้วว่าชาวมอญอยู่ในเอเชียตะวันออกเฉียงใต้ก่อนชาวพม่า” จากบทอ่านที่ ๑ การประเมินใดดีที่สุด","en":"A student writes: “Historians have proved that the Mon were in Southeast Asia before the Burmans.” Using Passage 1, which is the best evaluation?"},"opts":[{"th":"ไม่มีหลักฐานสนับสนุน: มอญอยู่มา ๒,๐๐๐ ปี แต่ไม่มีใครบอกได้ว่าใครมาก่อน","en":"Not supported: the Mon lived there 2,000 years, but nobody can say who came first."},{"th":"มีหลักฐานสนับสนุน เพราะบทอ่านบอกว่ามอญอยู่ในเอเชียตะวันออกเฉียงใต้มากว่าสองพันปี","en":"Supported, because the passage says the Mon have lived in Southeast Asia for over two thousand years."},{"th":"มีหลักฐานสนับสนุน เพราะทั้งมอญและปยูสร้างเมืองในภูมิภาคนี้สมัยโบราณ","en":"Supported, because both the Mon and the Pyu built cities in ancient times in the region."},{"th":"ไม่มีหลักฐาน เพราะบทอ่านบอกว่านักประวัติศาสตร์รู้ว่าพม่ามาก่อน","en":"Not supported, because the passage says historians know that the Burmans came first."}]},{"id":"q4","passage":"p1","level":"create","box":"P","pts":2,"q":{"th":"คุณทำโปสเตอร์ห้องเรียนเรื่อง “ใครมาถึงพม่าก่อน” เหตุใกล้ของความเห็นต่างคือหลักฐานโบราณหายากและคนตีความต่างกัน แผนใดจัดการเรื่องนี้ได้ดีที่สุด","en":"You make a class poster on “Who arrived first in Burma?” The closest cause of the disagreement is that evidence from long ago is hard to find and people read it differently. Which plan handles this best?"},"opts":[{"th":"เลือกกลุ่มที่มีอาณาจักรเก่าแก่ที่สุดและนำเสนอว่าเป็นคำตอบที่ถูกต้องที่สุด","en":"Choose the group with the oldest kingdom and present it as the correct answer."},{"th":"ให้นักเรียนทุกคนโหวตว่ากลุ่มใดมาก่อนแล้วพิมพ์ผลโหวต","en":"Let every student vote on which group came first and print the vote result."},{"th":"ระบุแต่ละข้ออ้างพร้อมหลักฐาน และทำเครื่องหมายส่วนที่ยังไม่แน่นอน","en":"List each claim with its evidence, and mark what is still uncertain."},{"th":"ไม่ใส่คำถามนี้ในโปสเตอร์ เพื่อไม่ให้ใครในห้องรู้สึกไม่พอใจ","en":"Leave the question out of the poster so that nobody in class feels upset."}]},{"id":"q5","passage":"p2","level":"analyze","box":"M","pts":2,"q":{"th":"ข้อสรุปใดเกี่ยวกับศตวรรษที่ ๑๑ ที่บทอ่านที่ ๒ สนับสนุนได้ดีที่สุด โดยไม่เกินหลักฐาน","en":"Which conclusion about the 11th century does Passage 2 support best, without going beyond the evidence?"},"opts":[{"th":"ชาวมอญปกครองเมืองพุกามตลอดศตวรรษที่ ๑๑","en":"The Mon ruled the city of Pagan for the whole of the 11th century."},{"th":"ชาวพม่าเรียนรู้ทุกอย่างเกี่ยวกับการเขียนและศาสนาจากชาวมอญ","en":"The Burmans learned everything they know about writing and religion from the Mon."},{"th":"ช่างชาวมอญทำงานที่พุกาม และชาวพม่าอิงภาษาเขียนของตนจากมอญ","en":"Mon builders worked at Pagan, and Burmans based their writing on Mon."},{"th":"ชาวมอญและชาวพม่าไม่เคยทำสงครามกันแม้แต่ครั้งเดียวในประวัติศาสตร์","en":"The Mon and the Burmans never fought a single war with each other in history."}]},{"id":"q6","passage":"p2","level":"evaluate","box":"C","pts":2,"q":{"th":"เว็บไซต์แห่งหนึ่งเขียนว่า “อารยธรรมของพุกามเป็นของมอญล้วน ๆ” จากบทอ่านที่ ๒ การประเมินใดดีที่สุด","en":"A website says: “Pagan’s civilization was entirely Mon.” Which is the best evaluation using Passage 2?"},"opts":[{"th":"แรงเกินไป: บทอ่านว่าอารยธรรมพม่าและมอญ ไม่ใช่มอญอย่างเดียว","en":"Too strong: the passage says Burman and Mon civilization, not only Mon."},{"th":"ถูกต้อง เพราะบทอ่านบอกว่ามอญสร้างวัดเกือบ ๒,๐๐๐ แห่งในพุกาม","en":"Correct, because the passage says the Mon built nearly 2,000 temples in Pagan."},{"th":"ถูกต้อง เพราะบทอ่านบอกว่าพระเจ้ามนูหะปกครองพุกามตั้งแต่ ค.ศ. ๑๐๕๗","en":"Correct, because the passage says King Manuha ruled Pagan from the year 1057."},{"th":"อ่อนเกินไป: บทอ่านบอกว่ามอญไม่มีส่วนในพุกามเลย","en":"Too weak: the passage says the Mon had no part in Pagan at all."}]},{"id":"q7","passage":"p2","level":"analyze","box":"P","pts":2,"q":{"th":"บทอ่านที่ ๒ บอกว่าชาวพม่าพัฒนาภาษาเขียนอิงภาษามอญในศตวรรษที่ ๑๑ คำอธิบายเหตุใกล้ข้อใดที่บทอ่านสนับสนุนได้ดีที่สุด","en":"Passage 2 says Burmans developed a written language based on Mon in the 11th century. Which explanation of the CLOSEST cause does the passage support best?"},"opts":[{"th":"กองทัพมอญบังคับให้ชาวพม่าใช้ภาษาเขียนมอญในบันทึกทั้งหมด","en":"Mon armies forced the Burmans to use Mon writing in all their records."},{"th":"ก่อนหน้านั้นชาวพม่าไม่มีภาษาพูดของตนเอง","en":"The Burmans had no spoken language of their own before that time."},{"th":"กษัตริย์ตองอูต่อมาสั่งให้สองชนชาติใช้ตัวเขียนเดียวกัน","en":"The Toungoo kings later ordered both peoples to share one script."},{"th":"พระภิกษุและช่างชาวมอญมาพุกามและนำภาษาเขียนมาด้วย","en":"Mon monks and builders came to Pagan and brought their writing."}]},{"id":"q8","passage":"p2","level":"create","box":"F","pts":2,"q":{"th":"คุณเตรียมเส้นเวลาประวัติศาสตร์มอญจากบทอ่านที่ ๒ และต้องการใช้ AI “บทบาท” ของ AI แบบใดช่วยทั้งการเรียนรู้และความถูกต้องได้ดีที่สุด","en":"You prepare a Mon history timeline with Passage 2 and want to use AI. Which ROLE for the AI best supports learning AND accuracy?"},"opts":[{"th":"AI เขียนเส้นเวลาทั้งหมดให้กลุ่ม แล้วกลุ่มพิมพ์ออกมาตามนั้น","en":"AI writes the whole timeline for the group, and the group prints it as it is."},{"th":"AI ถามคำถามเกี่ยวกับแต่ละรายการ และกลุ่มตรวจคำตอบกับหนังสือ","en":"AI asks questions about each entry, and the group checks answers in the book."},{"th":"AI ตัดสินว่าเหตุการณ์ใดสำคัญและลบเหตุการณ์อื่นออกจากเส้นเวลา","en":"AI decides which events are important and removes the others from the timeline."},{"th":"AI เพิ่มปีจากความจำของมันเอง และกลุ่มเชื่อปีทั้งหมด","en":"AI adds extra dates from its own memory, and the group trusts all the dates."}]},{"id":"q9","passage":"p3","level":"evaluate","box":"F","pts":2,"q":{"th":"อังกฤษรู้สึกว่าการแยกกลุ่มชาติพันธุ์เป็นการ “ปกป้องกลุ่มที่เล็กและมีอำนาจน้อย” คำอธิบายนี้น่าจะทำ “หน้าที่” อะไร และควรประเมินอย่างไร","en":"The British also felt they were “protecting the smaller, less powerful ethnic groups” by keeping groups separate. What FUNCTION does this explanation most likely serve, and how should it be judged?"},"opts":[{"th":"เป็นข้อเท็จจริงที่เป็นกลางเกี่ยวกับกลุ่มต่าง ๆ จึงไม่ต้องตรวจเพิ่ม","en":"It is a neutral fact about the groups, so it needs no further checking."},{"th":"สนับสนุนนโยบายที่ทำให้ปกครองง่ายขึ้น จึงควรตรวจหลักฐานอื่น","en":"It backed a policy that made ruling easier, so check other evidence."},{"th":"พิสูจน์ว่าอังกฤษทำเพียงเพื่อช่วยกลุ่มชนส่วนน้อยเท่านั้น","en":"It proves that the British acted only in order to help the minority groups."},{"th":"เป็นเท็จ เพราะอังกฤษไม่สนใจปกครองพม่าเลย","en":"It is false, because the British had no interest in ruling Burma at all."}]},{"id":"q10","passage":"p3","level":"evaluate","box":"P","pts":2,"q":{"th":"นักเรียนคนหนึ่งเขียนว่า “อังกฤษเป็นต้นเหตุของปัญหาทั้งหมดระหว่างกลุ่มชาติพันธุ์ในพม่า” ข้อใดตัดสินได้ดีที่สุด","en":"A student writes: “The British caused all of the problems between ethnic groups in Burma.” Which judgement is best?"},"opts":[{"th":"มีหลักฐานสนับสนุน เพราะบทอ่านบอกว่าอังกฤษแบ่งแยกกลุ่มชาติพันธุ์ของพม่า","en":"Supported, because the passage says the British divided the ethnic groups of Burma."},{"th":"มีหลักฐานสนับสนุน เพราะอังกฤษใช้ทหารจากกลุ่มชนส่วนน้อยในกองทัพ","en":"Supported, because the British used soldiers from minority groups in their army."},{"th":"จริงบางส่วน: อังกฤษเพิ่มการแบ่งแยกแต่ไม่ได้ก่อปัญหาทั้งหมด","en":"Partly true: the British added to the divisions but did not cause all problems."},{"th":"ไม่มีหลักฐาน เพราะก่อนอังกฤษมาไม่มีการแบ่งแยกระหว่างกลุ่มเลย","en":"Not supported, because there were no divisions between groups before the British came."}]},{"id":"q11","passage":"p3","level":"create","box":"C","pts":2,"q":{"th":"คุณเขียนกติกาสำหรับการอภิปรายเรื่อง “แบ่งแยกแล้วปกครอง” เพื่อให้นักเรียนแยกข้อเท็จจริง ความเห็น และมุมมอง กติกาใดดีที่สุด","en":"You write a rule for a class debate on “divide and rule” so that students separate fact, opinion and perspective. Which rule is best?"},"opts":[{"th":"ถือว่าเป็นข้อเท็จจริง ถ้าเจ้าหน้าที่ชาวอังกฤษจดบันทึกไว้ในสมัยนั้นเอง","en":"Accept a statement as fact if the British officials wrote it down at the time."},{"th":"ถือว่าเป็นข้อเท็จจริง ถ้านักเรียนส่วนใหญ่เห็นด้วย","en":"Accept a statement as fact if most students in the class agree with it."},{"th":"ถือว่าทุกอย่างเกี่ยวกับอังกฤษเป็นความเห็นทั้งหมด เพราะอังกฤษเป็นผู้ปกครอง","en":"Treat everything about the British as opinion, because they were rulers."},{"th":"ถือเป็นข้อเท็จจริงเฉพาะที่ตรวจได้ และระบุเจ้าของมุมมองของข้ออื่น","en":"Call it fact only if it can be checked; note whose view the rest show."}]},{"id":"q12","passage":"p3","level":"create","box":"M","pts":2,"q":{"th":"หลังบทเรียนเรื่องการปกครองแบบอาณานิคม คุณจะรู้ได้ดีที่สุดอย่างไรว่านักเรียนแยกเหตุออกจากผลได้","en":"After a lesson on colonial rule, how will you best know whether students can separate causes from results?"},"opts":[{"th":"ก่อนและหลังเรียน ให้นักเรียนระบุเหตุและผลในบทอ่านแล้วเทียบกัน","en":"Before and after, have students label causes and results in a passage; compare."},{"th":"หลังเรียน ถามนักเรียนว่าสนุกกับการอ่านและการอภิปรายหรือไม่","en":"After the lesson, ask students whether they enjoyed the reading and the discussion."},{"th":"หลังเรียน ให้นักเรียนคัดรายการคำสำคัญทั้งหมดจากหนังสือ","en":"After the lesson, ask students to copy the whole list of key words from the book."},{"th":"ก่อนและหลังเรียน ทดสอบนักเรียนเรื่องปีของสงครามอังกฤษ–พม่า ๓ ครั้ง","en":"Before and after, test students on the years of the three Anglo-Burmese wars."}]}],"essays":[{"id":"e13","passage":"p1","level":"analyze","pts":12,"boxes":"CFMP","q":{"th":"โพสต์ในสื่อสังคมเขียนว่า “พระเจ้าตะเบ็งชเวตี้เป็นวีรบุรุษผู้ยิ่งใหญ่ของทุกคนในพม่า” ใช้ ๔ ช่อง (C F M P) และบทอ่านที่ ๑ วิเคราะห์ข้ออ้างนี้ เขียน ๓–๕ ประโยค","en":"A social media post says: “King Tabinshweti was a great hero for everyone in Burma.” Use the four boxes (C, F, M, P) and Passage 1 to analyse this claim. Write 3–5 sentences."}},{"id":"e14","passage":"p2","level":"evaluate","pts":12,"boxes":"CFMP","q":{"th":"แชตบอต AI ตอบว่า “ชาวมอญไม่มีอิทธิพลต่อพุกาม เพราะชาวพม่าสร้างทุกอย่างเอง” คุณจะเชื่อคำตอบนี้แค่ไหน ให้เหตุผล ๒ ข้อจากบทอ่านที่ ๒ และบอกว่าจะตรวจอะไร ที่ไหน เขียน ๓–๕ ประโยค","en":"An AI chatbot answers: “The Mon had no influence on Pagan, because the Burmans built everything themselves.” How much do you trust this answer? Give TWO reasons from Passage 2, and say what you would check and where. Write 3–5 sentences."}},{"id":"e15","passage":"p3","level":"create","pts":12,"boxes":"CFMP","q":{"th":"คุณจะจัดกิจกรรม ๑ ชั่วโมงให้น้อง ๆ เรื่องนโยบาย “แบ่งแยกแล้วปกครอง” ของอังกฤษ หรือสงครามอังกฤษ–พม่า ออกแบบกิจกรรมนี้ โดยเขียน (๑) จุดมุ่งหมาย (๒) ขั้นตอน (๓) จะใช้ AI อย่างไรและตรวจคำตอบของ AI อย่างไร (๔) จะรู้ได้อย่างไรว่าได้ผล (๔–๖ ประโยคหรือรายการสั้น)","en":"You will run a 1-hour activity for younger students about the British “divide and rule” policy or the Anglo-Burmese wars. Design the activity. Write: (1) the aim, (2) the steps, (3) how AI may be used and how its answers will be checked, (4) how you will know it worked. (4–6 sentences or a short list)"}}],"rubric":[{"id":"r1","th":"๑ ระบุประเด็น/ข้ออ้าง","en":"1 Identify the issue/claim","d":["ไม่ตอบ/ไม่เกี่ยว","คลุมเครือ","ตรงโจทย์บางส่วน","ชัดเจน ตรงโจทย์"]},{"id":"r2","th":"๒ แยกแยะด้วยกรอบ CFMP (ข้อ ๑๕: ใช้ CFMP/เกณฑ์ตรวจในการออกแบบ)","en":"2 Analyse with CFMP (item 15: uses CFMP/checking criteria in the design)","d":["ไม่แยกแยะ","ใช้ ๑ ช่อง","ใช้ ๒–๓ ช่อง","ใช้ครบ ๔ ช่อง ถูกต้อง"]},{"id":"r3","th":"๓ ใช้หลักฐานจากบทอ่านและเชื่อมเหตุผล","e /* ---------- API (Google Apps Script) ---------- */
async function api(action, payload = {}, timeout = 25000) {
  const url = apiUrl(); if (!url) throw new Error('NO_URL');
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(url, { method: 'POST', body: JSON.stringify({ action, ...payload }), signal: ctl.signal, redirect: 'follow' });
    const txt = await r.text(); let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('BAD_RESPONSE'); }
    return j;
  } finally { clearTimeout(t); }
}
async function fetchRemoteConfig() {
  const url = apiUrl(); if (!url) return null;
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);
  try { const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'action=config&_=' + Date.now(), { signal: ctl.signal }); const j = await r.json(); return j && j.ok ? j : null; }
  catch (e) { return null; } finally { clearTimeout(t); }
}

const fmtDay = s => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? '' : d.toLocaleDateString(LANG === 'th' ? 'th-TH-u-ca-buddhist' : 'en-GB', { dateStyle: 'long' }); };

const saveDraft = () => { if (ST.view === 'exam') LS.set('draft', { code: ST.code, phase: ST.phase, date: ST.date, answers: ST.answers, essays: ST.essays, startedAt: ST.startedAt, id: ST.id, lang: LANG, at: Date.now() }); };
const numOf = id => { const i = CFG.mcq.findIndex(q => q.id === id); return i >= 0 ? i + 1 : CFG.mcq.length + CFG.essays.findIndex(q => q.id === id) + 1; };
const passNo = id => CFG.passages.findIndex(p => p.id === id) + 1;

}

  const timer = s.timerMin > 0 ? `<span class="chip" id="timer">—</span>` : '';

  <section class="card reveal"><h2><span class="ic">📋</span>${esc(T('instr'))}</h2><ol class="ins">${CFG.instr.map(i => `<li><span>${esc(tx(i))}</span></li>`).join('')}</ol></section>

  <div class="sec-h reveal"><h2>${esc(tx(m.parts[0].title))}</h2><p>${esc(tx(m.parts[0].sub))}</p></div>${p1}

  <div class="dock"><div class="in"><div class="prog"><span>${esc(T('answered'))} <b id="ac">0</b> ${esc(T('of'))} ${totalItems()}</span><div class="mini"><i id="mb"></i></div></div><button class="btn" id="submit">${ic('check')}${esc(T('submit'))}</button></div></div>

  observeReveal(); updateProgress(); tickTimer(); clearInterval(timerH); timerH = setInterval(tickTimer, 1000);

function observeReveal() {
  const els = $$('.reveal:not(.in)'); if (!('IntersectionObserver' in window)) return els.forEach(e => e.classList.add('in'));
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px', threshold: .04 });
  els.forEach((e, i) => { e.style.transitionDelay = Math.min(i, 3) * 70 + 'ms'; io.observe(e); });
}
function updateProgress() {
  const a = answeredCount(), t = totalItems(), pct = t ? Math.round(a / t * 100) : 0;
  const x = $('#ac'); if (x) x.textContent = a; const mb = $('#mb'); if (mb) mb.style.width = pct + '%'; const pb = $('#pb'); if (pb) pb.style.width = pct + '%';
}
function tickTimer() {
  const el = $('#timer'); if (!el || !ST.startedAt) return;
  const lim = (+CFG.settings.timerMin || 0) * 60, used = Math.floor((Date.now() - ST.startedAt) / 1000), left = lim - used;
  const f = s => { s = Math.abs(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  if (left >= 0) { el.textContent = `${T('timeLeft')} ${f(left)}`; el.classList.remove('warn'); el.classList.toggle('gold', left < 300); }
  else { el.textContent = `${T('overtime')} +${f(left)}`; el.classList.add('warn'); }
}

/* ---------- submit ---------- */
function validateIdent() {
  const c = ST.code.trim(); let msg = '';
  if (!c) msg = T('needCode'); else if (CFG.settings.codePattern) { try { if (!new RegExp(CFG.settings.codePattern, 'i').test(c)) msg = T('badCode'); } catch (e) { } }
  if (!msg && !ST.date) { msg = T('needDate'); const d = $('#tdate'); d && d.classList.add('err'); }
  if (!msg && !ST.phase) msg = T('needPhase');
  if (msg) { const i = $('#code'); i && (i.classList.remove('err'), void i.offsetWidth, i.classList.add('err')); window.scrollTo({ top: 0, behavior: 'smooth' }); toast(msg, true); if (!c) i && setTimeout(() => i.focus(), 400); return false; }
  return true;
}
function trySubmit() {
  if (ST.sending) return; if (!validateIdent()) return;
  const miss = unanswered();
  if (miss.length) {
    const ids = [...CFG.mcq, ...CFG.essays].filter(q => miss.includes(numOf(q.id))).map(q => q.id);
    const req = CFG.settings.requireAll;
    const m = modal(`<h3>${esc(T('confirmTitle'))}</h3><p>${esc(req ? T('needAll') : T('confirmMsg'))} <b>${miss.join(', ')}</b></p><div class="acts"><button class="btn sec" data-x="back">${esc(T('back'))}</button>${req ? '' : `<button class="btn" data-x="go">${esc(T('sendAnyway'))}</button>`}</div>`);
    m.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (!x) return; m.close(); if (x.dataset.x === 'go') send(); else { const el = $('#Q-' + ids[0]); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); ids.forEach(id => { const q = $('#Q-' + id); q && (q.classList.remove('missing'), void q.offsetWidth, q.classList.add('missing')); }); } } });
    return;
  }
  const m = modal(`<h3>${esc(T('sureTitle'))}</h3><p>${esc(T('sureMsg'))}</p><div class="acts"><button class="btn sec" data-x="back">${esc(T('back'))}</button><button class="btn" data-x="go">${esc(T('submit'))}</button></div>`);
  m.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (!x) return; m.close(); if (x.dataset.x === 'go') send(); });
}
function buildResponse() {
  const answers = {}; CFG.mcq.forEach(q => { if (ST.answers[q.id] != null) answers[q.id] = +ST.answers[q.id]; });
  const essays = {}; CFG.essays.forEach(q => { if ((ST.essays[q.id] || '').trim()) essays[q.id] = ST.essays[q.id]; });
  return { id: ST.id || (ST.id = uid()), ts: Date.now(), code: ST.code.trim(), phase: ST.phase, date: ST.date, lang: LANG, secs: Math.round((Date.now() - (ST.startedAt || Date.now())) / 1000), answers, essays, rev: CFG.rev, ua: (navigator.userAgent || '').slice(0, 140) };
}
function localSubmit(r) {
  const list = LS.get('resp', []);
  if (list.some(x => x.id === r.id)) return { ok: true };
  if (CFG.settings.uniqueCode && list.some(x => x.code.toLowerCase() === r.code.toLowerCase() && x.phase === r.phase)) return { ok: false, error: 'dup' };
  list.push(r); LS.set('resp', list); return { ok: true };
}
async function sendResponse(r) {
  if (demoMode()) return localSubmit(r);
  return api('submit', { response: r });
}
async function send() {
  const r = buildResponse(); ST.sending = true; const b = $('#submit'); if (b) { b.disabled = true; b.innerHTML = esc(T('sending')); }
  let res;
  try { res = await sendResponse(r); } catch (e) { res = { ok: false, error: 'NET' }; }
  ST.sending = false;
  if (res && res.ok) { LS.del('draft'); const q = LS.get('pending', []).filter(x => x.id !== r.id); LS.set('pending', q); ST.done = { code: r.code, ts: r.ts }; ST.view = 'done'; clearInterval(timerH); renderDone(); return; }
  if (b) { b.disabled = false; b.innerHTML = ic('check') + esc(T('submit')); }
  if (res && res.error === 'dup') { toast(T('dup'), true); return; }
  const q = LS.get('pending', []); if (!q.some(x => x.id === r.id)) { q.push(r); LS.set('pending', q); }
  const m = modal(`<h3>${esc(T('failTitle'))}</h3><p>${esc(T('failMsg'))}</p><div class="acts"><button class="btn" data-x="retry">${esc(T('retry'))}</button></div>`);
  m.addEventListener('click', e => { if (e.target.closest('[data-x]')) { m.close(); send(); } });
}
async function flushPending() {
  if (demoMode()) return; const q = LS.get('pending', []); if (!q.length) return;
  for (const r of q) { try { const res = await api('submit', { response: r }); if (res && (res.ok || res.error === 'dup')) LS.set('pending', LS.get('pending', []).filter(x => x.id !== r.id)); } catch (e) { break; } }
}
function renderDone() {
  const d = ST.done;
  $('#app').innerHTML = headerHtml(langSeg()) + `<main class="wrap"><div class="done"><svg class="check" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M30 52l14 14 27-30"/></svg>
  <div class="thx mon" lang="mnw">${esc(CFG.meta.thanks)}</div><p>${esc(tx(CFG.meta.thanksSub))}</p>
  <div class="rc">${esc(T('receipt'))}: <b>${esc(d.code)}</b> · ${esc(T('sentAt'))} ${esc(fmtDate(d.ts, true))}</div>
  <button class="btn sec" id="nextP" style="margin-top:14px">${esc(T('next'))}</button></div></main>`;
  $('#pb').style.width = '100%'; petals();
}
function petals() {
  const cols = [CFG.theme.primary, CFG.theme.accent, '#7dd957', '#2a6fa8'];
  for (let i = 0; i < 34; i++) { const p = document.createElement('i'); p.className = 'petal'; p.style.left = Math.random() * 100 + 'vw'; p.style.background = cols[i % cols.length]; p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); p.style.animationDuration = 2.6 + Math.random() * 2.4 + 's'; p.style.animationDelay = Math.random() * 1.4 + 's'; document.body.appendChild(p); setTimeout(() => p.remove(), 7500); }
}
function resetStudent() { ST = { view: 'splash', code: '', phase: '', date: today(), answers: {}, essays: {}, startedAt: 0, id: '', done: null, sending: false }; LS.del('draft'); renderSplash(); }

function attState(it) {
  const a = (CFG.hub && CFG.hub.att) || {}, mode = it.att || 'auto', t = today(), s = hm(it.start), e = hm(it.end), n = nowMin();
  const late = it.date === t && s != null && n > s + (+a.lateAfter || 0);
  if (mode === 'closed') return { st: 'closed' };
  if (mode === 'open') return { st: 'open', late };
  if (!it.date) return { st: 'none' };
  if (it.date < t) return { st: 'closed' };
  if (it.date > t) return { st: 'soon' };
  if (s != null && n < s - (+a.openBefore || 0)) return { st: 'soon' };
  if (e != null && n > e + (+a.closeAfter || 0)) return { st: 'closed' };
  return { st: 'open', late };
}

function localAttend(rec) {

  const log = LS.get('attLog', []), old = log.find(x => x.code.toLowerCase() === rec.code.toLowerCase() && x.sid === rec.sid);
  if (old) return { ok: true, dup: true, status: old.status, at: old.clock };

  log.push({ id: rec.id, time: rec.ts, date: today(), clock, code: rec.code, sid: rec.sid, status, note: '', src: 'student' }); LS.set('attLog', log);

function joinCfg(pub, sec) {

  c.mcq.forEach(q => { q.key = sec.keys && sec.keys[q.id] != null ? sec.keys[q.id] : null; q.why = (sec.why && sec.why[q.id]) || ''; });
  c.essays.forEach(e => { e.guide = (sec.guide && sec.guide[e.id]) || ''; });
  ((c.sched && c.sched.items) || []).forEach(i => { i.code = (sec.att && sec.att[i.id]) || ''; });
  return c;
}
function splitCfg(full) {
  const pub = clone(full), sec = { keys: {}, why: {}, guide: {}, att: {} };
  pub.mcq.forEach(q => { if (q.key != null && q.key !== '') sec.keys[q.id] = +q.key; if (q.why) sec.why[q.id] = q.why; delete q.key; delete q.why; });
  pub.essays.forEach(e => { if (e.guide) sec.guide[e.id] = e.guide; delete e.guide; });

}
async function seedSecret(pin) {
  try {
    const b = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(SEED.salt), iterations: SEED.it, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

    return JSON.parse(new TextDecoder().decode(pt));
  } catch (e) { return { keys: {}, why: {}, guide: {} }; }
}

function structAct(act) {
  const [a, arr, i, j] = act.split('|'); const c = ADM, I = +i, J = +j;
  const A = { instr: () => ({ th: '', en: '' }), boxes: () => ({ k: '?', th: '', en: '', ask: { th: '', en: '' } }), passages: () => ({ id: nid('p'), title: { th: '', en: '' }, text: { th: '', en: '' }, src: { th: '', en: '' } }), mcq: () => ({ id: nid('q'), passage: (c.passages[0] || {}).id, level: c.levels[0].id, box: (c.boxes[0] || {}).k, pts: 2, q: { th: '', en: '' }, opts: [0, 1, 2, 3].map(() => ({ th: '', en: '' })), key: null, why: '' }), essays: () => ({ id: nid('e'), passage: (c.passages[0] || {}).id, level: c.levels[c.levels.length - 1].id, pts: 12, boxes: c.boxes.map(b => b.k).join(''), q: { th: '', en: '' }, guide: '' }), rubric: () => ({ id: nid('r'), th: '', en: '', d: Array.from({ length: (+c.rubricMax || 3) + 1 }, () => '') }), levels: () => ({ id: nid('lv'), th: 'ระดับใหม่', en: 'New', color: '#888888' }), bands: () => ({ min: 0, th: '', en: '' }) };
  if (a === 'add') c[arr].push(A[arr]());
  else if (a === 'up' && I > 0) [c[arr][I - 1], c[arr][I]] = [c[arr][I], c[arr][I - 1]];
  else if (a === 'down' && I < c[arr].length - 1) [c[arr][I + 1], c[arr][I]] = [c[arr][I], c[arr][I + 1]];
  else if (a === 'del') {
    if (arr === 'passages' && (c.mcq.some(q => q.passage === c.passages[I].id) || c.essays.some(q => q.passage === c.passages[I].id))) { toast('ลบไม่ได้: มีข้อสอบอ้างอิงบทอ่านนี้อยู่ ให้ย้าย/ลบข้อสอบก่อน', true); return; }
    if (arr === 'levels' && (c.mcq.some(q => q.level === c.levels[I].id) || c.essays.some(q => q.level === c.levels[I].id))) { toast('ลบไม่ได้: มีข้อสอบใช้ระดับนี้อยู่', true); return; }
    if (arr === 'levels' && c.levels.length <= 1) return;
    return askYes('ลบรายการนี้?', 'ลบ').then(y => { if (y) { c[arr].splice(I, 1); markDirty(); renderAdminBody(); } });
  }
  else if (a === 'addopt') c.mcq[I].opts.push({ th: '', en: '' });
  else if (a === 'delopt') { const q = c.mcq[I]; q.opts.splice(J, 1); if (q.key === J) q.key = null; else if (q.key > J) q.key--; }
  markDirty(); renderAdminBody();
}

function resizeImg(file, max = 420) {

}

  <div class="card"><h2>เวลาเรียนเริ่มต้นและชื่อโปรแกรม</h2><div class="grid g2"><div><label class="fld">ภาคเช้า (แสดงเมื่อคาบไม่ได้ระบุเวลา)</label>${inp('sched.times.am')}</div><div><label class="fld">ภาคบ่าย</label>${inp('sched.times.pm')}</div></div><div style="height:8px"></div>${L2('ชื่อโปรแกรม', 'hub.program')}<div style="height:8px"></div>${L2('คำอธิบายโปรแกรม', 'hub.programSub', 2)}</div>`;
  if (sub === 'weeks') return pills + S.weeks.map((w, i) => `<details class="card" style="margin:10px 0"><summary style="cursor:pointer;font-weight:700;color:var(--primary)">สัปดาห์ที่ ${w.n} · ${esc(tx0(w.topic))}</summary><div style="margin-top:10px"><div class="grid g3"><div><label class="fld">ช่วง (1–3)</label>${inp(`sched.weeks.${i}.phase`, { type: 'number', t: 'n', min: 1, max: 3 })}</div><div><label class="fld">ช่อง CFMP</label>${inp(`sched.weeks.${i}.cfmp`)}</div><div><label class="fld">ระดับ Bloom</label>${inp(`sched.weeks.${i}.bloom`)}</div></div>
   ${L2('หัวข้อสัปดาห์', `sched.weeks.${i}.topic`)}${L2('บทบาท AI', `sched.weeks.${i}.ai`)}${L2('เนื้อหา (หนังสือ)', `sched.weeks.${i}.book`)}${L2('ชิ้นงาน / หลักฐาน', `sched.weeks.${i}.evidence`)}
   ${['h1', 'h2', 'h3'].map((h, k) => L2('ศึกษาด้วยตนเอง ชั่วโมงที่ ' + (k + 1), `sched.weeks.${i}.study.${h}`)).join('')}</div></details>`).join('');
  return pills + `<div class="card"><div class="row"><h2 style="margin:0">คาบเรียน (${S.items.length})</h2><span class="sp"></span><button class="btn sm" data-act3="add|sched.items">${ic('plus')}เพิ่มคาบ</button></div><p class="hint">วันที่ว่าง = “รอประกาศวัน” · ใช้แท็บ “เครื่องมือ” เติมวันที่ทั้งหมดในครั้งเดียว</p>

   <div class="grid g4"><div><label class="fld">ครั้งที่</label>${inp(`sched.items.${i}.n`, { type: 'number', t: 'n', min: 1 })}</div><div><label class="fld">สัปดาห์</label>${inp(`sched.items.${i}.week`, { type: 'number', t: 'n', min: 1, max: 12 })}</div><div><label class="fld">ภาค</label>${sel(`sched.items.${i}.slot`, [['am', 'เช้า'], ['pm', 'บ่าย']])}</div><div><label class="fld">วันที่</label>${inp(`sched.items.${i}.date`, { type: 'date' })}</div>

function schedFill() {

const NEW3 = {
  'sched.items': () => { const n = Math.max(0, ...ADM.sched.items.map(i => i.n)) + 1, am = n % 2 === 1; return { id: nid('s'), n, week: Math.ceil(n / 2), slot: am ? 'am' : 'pm', date: '', start: am ? '09:00' : '12:30', end: am ? '11:00' : '14:30', att: 'auto', room: '', title: { th: '', en: '' } }; },
  'media.items': () => ({ id: nid('m'), type: 'video', week: 0, url: '', title: { th: '', en: '' }, desc: { th: '', en: '' } }),
  'hw.items': () => ({ id: nid('h'), week: 0, due: '', open: true, allowText: true, allowLink: true, allowFile: true, title: { th: '', en: '' }, desc: { th: '', en: '' } }),
  'ailog.pledge': () => ({ k: nid('pl'), pali: { th: '', en: '' }, th: '', en: '' }), 'ailog.teacher': () => ({ k: nid('t'), th: '', en: '' }),
  'ailog.codes.A': () => ({ c: '', th: '', en: '' }), 'ailog.codes.L': () => ({ c: 'L' + (ADM.ailog.codes.L.length + 1), th: '', en: '', pt: ADM.ailog.codes.L.length + 1 }), 'ailog.codes.I': () => ({ c: 'I' + ADM.ailog.codes.I.length, th: '', en: '', risk: 0 }), 'ailog.codes.V': () => ({ c: 'V' + (ADM.ailog.codes.V.length + 1), th: '', en: '', risk: 0 })
};
const mv3 = (path, i, n) => `<button class="btn ghost sm" data-act3="up|${path}|${i}" ${i === 0 ? 'disabled' : ''} aria-label="ขึ้น">${ic('up')}</button><button class="btn ghost sm" data-act3="down|${path}|${i}" ${i === n - 1 ? 'disabled' : ''} aria-label="ลง">${ic('down')}</button><button class="btn ghost sm" data-act3="del|${path}|${i}" aria-label="ลบ" style="color:var(--bad)">${ic('trash')}</button>`;
document.addEventListener('click', async e => {
  const t = e.target; if (!t.closest('#admin')) return; let x;
  if ((x = t.closest('[data-act3]'))) {
    const [a, path, i] = x.dataset.act3.split('|'), arr = getP(ADM, path), I = +i;
    if (a === 'add') arr.push(NEW3[path]());
    else if (a === 'up' && I > 0) [arr[I - 1], arr[I]] = [arr[I], arr[I - 1]];
    else if (a === 'down' && I < arr.length - 1) [arr[I + 1], arr[I]] = [arr[I], arr[I + 1]];
    else if (a === 'del') { if (!(await askYes('ลบรายการนี้?', 'ลบ'))) return; arr.splice(I, 1); }
    markDirty(); return renderAdminBody();
  }
  if ((x = t.closest('[data-attset]'))) { const [c, sid] = x.dataset.attset.split('|'); return attSet(c, sid); }
  if ((x = t.closest('[data-hws]'))) { AD.hwSub = x.dataset.hws; return renderAdminBody(); }
  if ((x = t.closest('[data-als]'))) { AD.alSub = x.dataset.als; return renderAdminBody(); }
  if ((x = t.closest('[data-scs]'))) { AD.scSub = x.dataset.scs; return renderAdminBody(); }
  if ((x = t.closest('[data-hwdel]'))) { e.stopPropagation(); if (await askYes('ลบงานที่ส่งนี้ถาวร? (ไฟล์ใน Drive ไม่ถูกลบ)', 'ลบ')) { try { if (demoMode()) LS.set('hwLog', LS.get('hwLog', []).filter(r => r.id !== x.dataset.hwdel)); else { const r = await api('hwDelete', { token: AD.tok, id: x.dataset.hwdel }); if (!r || !r.ok) throw 0; } AD.hw = AD.hw.filter(r => r.id !== x.dataset.hwdel); renderAdminBody(); toast('ลบแล้ว'); } catch (er) { toast('ลบไม่สำเร็จ', true); } } return; }
  if ((x = t.closest('[data-hwopen]'))) return openHwDetail(x.dataset.hwopen);
  if ((x = t.closest('[data-aldel]'))) { e.stopPropagation(); if (await askYes('ลบบันทึกนี้ถาวร?', 'ลบ')) { try { if (demoMode()) LS.set('ailLog', LS.get('ailLog', []).filter(r => r.id !== x.dataset.aldel)); else { const r = await api('ailogDelete', { token: AD.tok, id: x.dataset.aldel }); if (!r || !r.ok) throw 0; } AD.ail = AD.ail.filter(r => r.id !== x.dataset.aldel); renderAdminBody(); toast('ลบแล้ว'); } catch (er) { toast('ลบไม่สำเร็จ', true); } } return; }
  if ((x = t.closest('[data-alopen]'))) return openAlDetail(x.dataset.alopen);
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.closest('#admin')) return;
  if (t.id === 'hwSel') { AD.hwSel = t.value; renderAdminBody(); }
  if (t.id === 'alst') { AD.alF.st = t.value; renderAdminBody(); }
});
document.addEventListener('input', e => {
  const t = e.target; if (t.id === 'alq' && t.closest('#admin')) { AD.alF.q = t.value; const p = t.selectionStart; renderAdminBody(); const n = $('#alq'); n.focus(); n.setSelectionRange(p, p); }
});
